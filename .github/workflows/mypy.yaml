name: static type checking

on:
  pull_request:
  push:
    branches:
      - main
      - ci-dev

# Cancel superseded runs on the same PR branch; never cancel pushes (run_id is unique).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mypy:
    name: Run MyPy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [airo-typing,airo-spatial-algebra,airo-camera-toolkit, airo-robots,airo-dataset-tools] #TODO: autodiscover?
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      id: setup-python
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@v4
      with:
        # Cache uv's wheel download/build cache so venv rebuilds (on a setup.py
        # change) don't re-download heavy deps like open3d/opencv/rerun-sdk.
        enable-cache: true
        cache-dependency-glob: "**/setup.py"
        # When the venv cache hits, the install step is skipped and uv never
        # runs, so its cache dir is absent — don't fail the post-step on that.
        ignore-nothing-to-cache: true

    - uses: actions/cache@v4
      id: cache-venv
      with:
        path: .venv
        # Includes source files, not just setup.py, so a change to any package's code
        # (not only its dependencies) invalidates this venv and gets reinstalled.
        # The separate uv wheel cache above is still keyed on setup.py only, so this
        # doesn't reintroduce heavy dependency re-downloads on every source change.
        # A venv's bin/python is a symlink to an interpreter outside .venv, so key on the exact
        # Python version (e.g. 3.10.21, not 3.10): a runner image update must not restore a venv
        # whose interpreter no longer exists.
        key: venv-mypy-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/setup.py', '**/*.py') }}

    - name: Install packages
      run: |
        # Safety net: also rebuild if a restored venv is broken (e.g. its interpreter is missing).
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" = "true" ] && .venv/bin/mypy --version > /dev/null 2>&1; then
          echo "Using cached venv."
          exit 0
        fi
        rm -rf .venv
        uv venv .venv --python ${{ steps.setup-python.outputs.python-path }}
        uv pip install --python .venv/bin/python mypy
        uv pip install --python .venv/bin/python airo-typing/ airo-spatial-algebra/ airo-camera-toolkit/ airo-robots/ airo-dataset-tools/

    - uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: mypy-${{ matrix.package }}-${{ hashFiles('**/setup.py') }}
        restore-keys: mypy-${{ matrix.package }}-

    - name: Run type checker
      run: .venv/bin/mypy ${{ matrix.package }}/
