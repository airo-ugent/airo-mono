# Auto-create a version-bump PR when new code lands on main.
# When that PR is merged, the publish-release workflow runs.
name: Prepare Release

on:
  push:
    branches: [main]

  # Manual trigger (e.g. to force a release regardless of date)
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'Update version numbers for')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine next version
        id: version
        run: |
          CURRENT=$(grep -oP 'version="?\K[0-9.]+' airo-typing/setup.py | head -1)
          echo "Current version: $CURRENT"
          NEXT=$(python3 scripts/next_version.py "$CURRENT")
          echo "Next version: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$NEXT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version numbers
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          for f in airo-camera-toolkit/setup.py airo-dataset-tools/setup.py \
                   airo-robots/setup.py airo-spatial-algebra/setup.py \
                   airo-typing/setup.py; do
            sed -i "s/version=\"[0-9.]*\"/version=\"$VERSION\"/g" "$f"
          done
          sed -i "s/^version: [0-9.]*$/version: $VERSION/" CITATION.cff

      - name: Close CHANGELOG section
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          TODAY=$(date +%Y-%m-%d)
          if ! grep -q "^## Unreleased$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## Unreleased' section to close - add one before merging this release."
            exit 1
          fi
          sed -i "s/^## Unreleased$/## Unreleased\n\n## $VERSION\n\nReleased: $TODAY/" CHANGELOG.md

      - name: Create version-bump PR
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          BRANCH="release/$VERSION"

          # If a PR for this branch is already open, only rebuild it when every commit on it
          # came from this workflow's own bot account. That means nobody has hand-edited it
          # (e.g. fixing a CHANGELOG line) yet, so it's safe to refresh with the latest main
          # and pick up whatever landed since the PR was opened. If a human has pushed a
          # commit, leave the branch untouched so a force-push never clobbers their work.
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            NON_BOT_COMMITS=$(gh api "repos/${{ github.repository }}/pulls/$EXISTING_PR/commits" \
              --jq '[.[].author.login] | map(select(. != "github-actions[bot]")) | length')
            if [ "$NON_BOT_COMMITS" != "0" ]; then
              echo "PR #$EXISTING_PR has human commits, leaving it untouched"
              exit 0
            fi
            echo "PR #$EXISTING_PR is bot-only, refreshing it with the latest main"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git diff --cached --quiet || git commit -m "Update version numbers for $VERSION"
          # Safe to force-push: we've confirmed there is either no open PR, or an open PR
          # made up entirely of this workflow's own bot commits with nothing to lose.
          git push --force origin "$BRANCH"

          if [ -z "$EXISTING_PR" ]; then
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $VERSION" \
            --body "Automated version bump to **$VERSION** (released $(date +%Y-%m-%d)).

          Merge this PR to publish to PyPI and create the GitHub release.

          \`\`\`
          Auto-generated by the prepare-release workflow.
          \`\`\`"
          fi